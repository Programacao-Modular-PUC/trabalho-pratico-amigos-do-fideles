<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos do Fideles - Cadastro de Amigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/loginCadastro.css">
</head>

<body>
    <div class="container">
        <div class="custom-card register-card">
            <div class="card-header-logo">
                <img src="../img/logo.png" alt="Amigos do Fideles Logo">
                <h2 class="auth-title">Torne-se um Amigo</h2>
                <p class="auth-subtitle">Preencha seus dados para receber as chaves.</p>
            </div>

            <div id="msg-erro" class="alert alert-danger d-none" role="alert"></div>
            <div id="msg-sucesso" class="alert alert-success d-none" role="alert"></div>

            <form id="form-cadastro">
                <div class="mb-4">
                    <h5 class="section-title">Tipo de Cadastro</h5>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoCadastro" id="tipoCliente"
                                value="cliente" checked onchange="alterarTipo()">
                            <label class="form-check-label" for="tipoCliente">Cliente</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoCadastro" id="tipoProprietario"
                                value="proprietario" onchange="alterarTipo()">
                            <label class="form-check-label" for="tipoProprietario">Proprietário</label>
                        </div>
                    </div>
                </div>
                <h5 class="section-title">Dados Pessoais</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-8">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" id="nome" class="form-control" placeholder="Seu nome completo" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">CPF</label>
                        <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Telefone</label>
                        <input type="tel" id="telefone" class="form-control" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <h5 class="section-title">Endereço de Contato</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-9">
                        <label class="form-label">Rua / Logradouro</label>
                        <input type="text" id="rua" class="form-control" placeholder="Ex: Av. Principal" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Número</label>
                        <input type="text" id="numero" class="form-control" placeholder="123" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Bairro</label>
                        <input type="text" id="bairro" class="form-control" placeholder="Nome do Bairro" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">CEP</label>
                        <input type="text" id="cep" class="form-control" placeholder="00000-000" required>
                    </div>
                </div>

                <h5 class="section-title">Segurança da Conta</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Senha</label>
                        <input type="password" id="senha" class="form-control" placeholder="Mínimo 6 caracteres"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" class="form-control" placeholder="Repita a senha"
                            required>
                    </div>
                </div>

                <button type="submit" id="btn-cadastro" class="btn btn-auth py-3 fw-bold mt-2">Finalizar
                    Cadastro</button>
                <div class="auth-footer text-center mt-3">
                    <span class="text-muted">Já é um amigo? <a href="login.html" class="auth-link">Acesse
                            aqui</a></span>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/register.js"></script>
</body>

</html>
