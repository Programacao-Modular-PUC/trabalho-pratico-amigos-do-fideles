<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos do Fideles - Cadastro de Amigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/loginCadastro.css">
</head>
<body>

<div class="container">
    <div class="custom-card register-card">
        <div class="card-header-logo">
            <img src="../img/logo.png" alt="Amigos do Fideles Logo">
            <h2 class="auth-title">Torne-se um Amigo</h2>
            <p class="auth-subtitle">Preencha seus dados para receber as chaves.</p>
        </div>

        <form>
            <h5 class="section-title">Dados Pessoais</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" placeholder="Seu nome completo" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" placeholder="000.000.000-00" id="cpf" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" placeholder="exemplo@email.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Telefone</label>
                    <input type="tel" class="form-control" placeholder="(00) 00000-0000" id="telefone" required>
                </div>
            </div>

            <h5 class="section-title">Endereço de Contato</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-9">
                    <label class="form-label">Rua / Logradouro</label>
                    <input type="text" class="form-control" placeholder="Ex: Av. Principal" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Número</label>
                    <input type="text" class="form-control" placeholder="123" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Bairro</label>
                    <input type="text" class="form-control" placeholder="Nome do Bairro" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">CEP</label>
                    <input type="text" class="form-control" placeholder="00000-000" id="cep" required>
                </div>
            </div>

            <h5 class="section-title">Segurança da Conta</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" placeholder="Crie uma senha" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" placeholder="Repita a senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-auth py-3 fw-bold mt-2">Finalizar Cadastro</button>
            
            <div class="auth-footer text-center mt-3">
                <span class="text-muted">Já é um amigo? <a href="login.html" class="auth-link">Acesse aqui</a></span>
            </div>
        </form>
    </div>
</div>

<script>
    // Máscara de CPF
    document.getElementById('cpf').addEventListener('input', function (e) {
        var v = e.target.value.replace(/\D/g, '');
        if (v.length <= 11) {
            v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
            e.target.value = v;
        }
    });

    // Máscara de CEP
    document.getElementById('cep').addEventListener('input', function (e) {
        var v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{5})(\d{3})/, "$1-$2");
        e.target.value = v;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
