<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos do Fideles - Cadastro de Amigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/loginCadastro.css">
</head>
<body>
<div class="container">
    <div class="custom-card register-card">
        <div class="card-header-logo">
            <img src="../img/logo.png" alt="Amigos do Fideles Logo">
            <h2 class="auth-title">Torne-se um Amigo</h2>
            <p class="auth-subtitle">Preencha seus dados para receber as chaves.</p>
        </div>

        <div id="msg-erro" class="alert alert-danger d-none" role="alert"></div>
        <div id="msg-sucesso" class="alert alert-success d-none" role="alert"></div>

        <form id="form-cadastro">
            <h5 class="section-title">Dados Pessoais</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" id="nome" class="form-control" placeholder="Seu nome completo" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">CPF</label>
                    <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Telefone</label>
                    <input type="tel" id="telefone" class="form-control" placeholder="(00) 00000-0000" required>
                </div>
            </div>

            <h5 class="section-title">Endereço de Contato</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-9">
                    <label class="form-label">Rua / Logradouro</label>
                    <input type="text" id="rua" class="form-control" placeholder="Ex: Av. Principal" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Número</label>
                    <input type="text" id="numero" class="form-control" placeholder="123" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Bairro</label>
                    <input type="text" id="bairro" class="form-control" placeholder="Nome do Bairro" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">CEP</label>
                    <input type="text" id="cep" class="form-control" placeholder="00000-000" required>
                </div>
            </div>

            <h5 class="section-title">Segurança da Conta</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Senha</label>
                    <input type="password" id="senha" class="form-control" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" class="form-control" placeholder="Repita a senha" required>
                </div>
            </div>

            <button type="submit" id="btn-cadastro" class="btn btn-auth py-3 fw-bold mt-2">Finalizar Cadastro</button>
            <div class="auth-footer text-center mt-3">
                <span class="text-muted">Já é um amigo? <a href="login.html" class="auth-link">Acesse aqui</a></span>
            </div>
        </form>
    </div>
</div>

<script>
    const API = window.location.protocol === 'file:'
        ? 'http://localhost:8080'
        : (window.location.origin.includes('8080') ? '' : 'http://localhost:8080');

    document.getElementById('cpf').addEventListener('input', function (e) {
        var v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        e.target.value = v;
    });

    document.getElementById('cep').addEventListener('input', function (e) {
        var v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{5})(\d{3})/, "$1-$2");
        e.target.value = v;
    });

    document.getElementById('telefone').addEventListener('input', function (e) {
        var v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
        e.target.value = v;
    });

    document.getElementById('form-cadastro').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('btn-cadastro');
        const erro = document.getElementById('msg-erro');
        const sucesso = document.getElementById('msg-sucesso');
        erro.classList.add('d-none');
        sucesso.classList.add('d-none');

        const senha = document.getElementById('senha').value;
        const confirmar = document.getElementById('confirmar-senha').value;

        if (senha !== confirmar) {
            erro.textContent = 'As senhas não coincidem.';
            erro.classList.remove('d-none');
            return;
        }
        if (senha.length < 6) {
            erro.textContent = 'A senha deve ter no mínimo 6 caracteres.';
            erro.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Cadastrando...';

        const body = {
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value,
            endereco: `${document.getElementById('rua').value}, ${document.getElementById('numero').value} - ${document.getElementById('bairro').value}, CEP ${document.getElementById('cep').value}`,
            senha: senha
        };

        try {
            const res = await fetch(`${API}/auth/cadastro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.erro || 'Erro ao realizar cadastro.');
            }

            sessionStorage.setItem('clienteNome', data.nome);
            sessionStorage.setItem('clienteId', data.clienteId);

            sucesso.textContent = `Bem-vindo, ${data.nome}! Redirecionando...`;
            sucesso.classList.remove('d-none');
            setTimeout(() => window.location.href = 'index.html', 1500);

        } catch (err) {
            if (err.message === 'Failed to fetch') {
                erro.textContent = 'Não foi possível conectar ao servidor. Verifique se o backend está rodando na porta 8080.';
            } else {
                erro.textContent = err.message;
            }
            erro.classList.remove('d-none');
            btn.disabled = false;
            btn.textContent = 'Finalizar Cadastro';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
