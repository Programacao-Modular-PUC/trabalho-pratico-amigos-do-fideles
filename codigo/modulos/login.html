<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos do Fideles - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/loginCadastro.css">
</head>
<body class="flex-center">
    <div class="custom-card login-card">
        <div class="card-header-logo">
            <img src="../img/logo.png" alt="Logo">
            <p class="auth-subtitle mt-2">Sua hospedaria em Maraú te espera.</p>
        </div>
        <form>
            <div class="mb-3 text-start">
                <label class="form-label">E-mail ou CPF</label>
                <input type="text" class="form-control" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-auth">Acessar Hospedaria</button>
            <div class="mt-3">
                <small>Novo por aqui? <a href="register.html" class="auth-link">Crie uma conta</a></small>
            </div>
        </form>
    </div>
</body>
</html>
