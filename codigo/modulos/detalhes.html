<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Residência - Amigos do Fideles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/detalhes.css">
</head>
<body>

    <nav class="navbar navbar-fideles">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../img/logo.png" alt="Logo">
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar ao Catálogo
            </a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="detalhe-header">
            <div class="row">
                <div class="col-lg-7">
                    <img id="fotoPrincipal" src="" class="img-principal" alt="Residência">
                </div>
                <div class="col-lg-5 info-residencia">
                    <h1 id="nomeResidencia">Carregando...</h1>
                    <p id="enderecoResidencia" class="endereco-label">---</p>
                    <p id="descricaoResidencia" class="text-muted">---</p>
                    <hr>
                    <h5 class="fw-bold mb-3" style="color: var(--primary-marrom);">Quartos Disponíveis:</h5>
                    <div class="mb-3" id="filtroTipo">
                        <button class="btn-filtro ativo" onclick="filtrarQuartos('todos')">Todos</button>
                        <button class="btn-filtro" onclick="filtrarQuartos('individual')">Individual</button>
                        <button class="btn-filtro" onclick="filtrarQuartos('duplo')">Duplo</button>
                        <button class="btn-filtro" onclick="filtrarQuartos('familia')">Família</button>
                    </div>
                    <div id="listaQuartos">
                        <p class="text-muted">Carregando quartos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/detalhes.js"></script>
</body>
</html>
