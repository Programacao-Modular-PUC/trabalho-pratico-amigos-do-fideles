<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Residência - Amigos do Fideles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/detalhes.css">
</head>
<body>

    <nav class="navbar navbar-fideles">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../img/logo.png" alt="Logo">
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar ao Catálogo</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="detalhe-header">
            <div class="row">
                <div class="col-lg-7">
                    <img id="fotoPrincipal" src="https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=800" class="img-principal" alt="Residência">
                </div>
                <div class="col-lg-5 info-residencia">
                    <h1 id="nomeResidencia">Villa das Chaves</h1>
                    <p id="enderecoResidencia" class="endereco-label"><i class="bi bi-geo-alt"></i> Rua das Amendoeiras, 123 - Taipu de Fora, Maraú</p>
                    <p id="descricaoResidencia" class="text-muted">Carregando descrição...</p>
                    
                    <hr>
                    
                    <h5 class="fw-bold mb-3" style="color: var(--primary-marrom);">Quartos Disponíveis:</h5>
                    
                    <div id="listaQuartos">
                        <div class="quarto-card shadow-sm">
                            <div class="row align-items-center">
                                <div class="col-8">
                                    <span class="tipo-quarto">Quarto de Casal</span><br>
                                    <span class="tag-item">Ar-condicionado</span>
                                    <span class="tag-item">Hidromassagem</span>
                                </div>
                                <div class="col-4 text-end">
                                    <span class="valor-base">R$ 450</span><br>
                                    <a href="reserva.html" class="btn-reservar-quarto">Escolher</a>
                                </div>
                            </div>
                        </div>

                        <div class="quarto-card shadow-sm">
                            <div class="row align-items-center">
                                <div class="col-8">
                                    <span class="tipo-quarto">Quarto Individual</span><br>
                                    <span class="tag-item">Ar-condicionado</span>
                                </div>
                                <div class="col-4 text-end">
                                    <span class="valor-base">R$ 280</span><br>
                                    <a href="reserva.html" class="btn-reservar-quarto">Escolher</a>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const dadosResidencias = {
            'pousada': {
                nome: "Pousada Recanto do Sol",
                endereco: "Rua Principal, 10 - Barra Grande, Maraú",
                foto: "https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?w=800",
                descricao: "Um refúgio tranquilo com o melhor pôr do sol de Maraú. Ideal para casais e Amigos do Fideles que buscam paz e contato com a natureza."
            },
            'villa': {
                nome: "Villa das Chaves",
                endereco: "Rua das Amendoeiras, 123 - Taipu de Fora, Maraú",
                foto: "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=800",
                descricao: "Luxo e exclusividade em frente às piscinas naturais. Esta Villa oferece o que há de melhor em conforto rústico e sofisticação."
            },
            'bangalo': {
                nome: "Bangalô do Fideles",
                endereco: "Praia de Algodões, S/N - Maraú",
                foto: "https://images.unsplash.com/photo-1540541338287-41700207dee6?w=800",
                descricao: "Pé na areia e estilo rústico para uma experiência autêntica. O bangalô é a escolha perfeita para quem quer desconectar do mundo."
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const idResidencia = urlParams.get('id');

        if (idResidencia && dadosResidencias[idResidencia]) {
            const res = dadosResidencias[idResidencia];
            document.getElementById('nomeResidencia').innerText = res.nome;
            document.getElementById('enderecoResidencia').innerHTML = '<i class="bi bi-geo-alt"></i> ' + res.endereco;
            document.getElementById('descricaoResidencia').innerText = res.descricao;
            document.getElementById('fotoPrincipal').src = res.foto;
            document.title = res.nome + " - Amigos do Fideles";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
