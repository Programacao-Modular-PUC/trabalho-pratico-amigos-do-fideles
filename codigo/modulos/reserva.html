<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Reserva - Amigos do Fideles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/reserva.css">
</head>

<body>

    <nav class="navbar navbar-fideles">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../img/logo.png" alt="Logo" style="max-height: 60px;">
            </a>
            <span class="text-white">Finalizando sua reserva...</span>
        </div>
    </nav>

    <div class="container reserva-container">
        <div class="resumo-reserva">
            <div class="row">
                <div class="col-md-7 border-end">
                    <h4 class="secao-titulo">Configurar sua Estadia</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Data de Entrada</label>
                            <input type="date" id="dataEntrada" class="form-control input-reserva" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hora de Entrada</label>
                            <input type="time" id="horaEntrada" class="form-control input-reserva" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Data de Saída</label>
                            <input type="date" id="dataSaida" class="form-control input-reserva" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hora de Saída</label>
                            <input type="time" id="horaSaida" class="form-control input-reserva" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label">Observações Especiais</label>
                        <textarea class="form-control input-reserva" rows="3"
                            placeholder="Ex: Preciso de berço..."></textarea>
                    </div>

                    <div class="mt-3" id="campoHospedes" style="display:none;">
                        <label class="form-label">Quantidade de Hóspedes</label>
                        <input type="number" id="qtdHospedes" class="form-control input-reserva" min="1"
                            placeholder="Ex: 4">
                        <small class="text-muted">Informe o número de hóspedes para calcular o valor correto.</small>
                    </div>
                </div>

                <div class="col-md-5 ps-md-4">
                    <h4 class="secao-titulo">Resumo</h4>

                    <div class="info-item">
                        <div class="info-label">Residência</div>
                        <div id="resumoResidencia" class="info-valor">---</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Quarto Escolhido</div>
                        <div id="resumoQuarto" class="info-valor">---</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Valor da Diária</div>
                        <div id="resumoPreco" class="info-valor">R$ 0,00</div>
                    </div>

                    <div class="total-box mt-4">
                        <div class="info-label">Total Estimado</div>
                        <div class="total-valor" id="totalExibido">R$ 0,00</div>
                        <small id="legendaDias" class="text-muted">Selecione as datas para calcular</small>
                    </div>

                    <div id="infoDesconto" style="display:none;" class="mt-2 text-center">
                        <small class="text-success fw-bold" id="textoDesconto"></small>
                    </div>

                    <button class="btn-confirmar" onclick="confirmarAluguel()">Confirmar Aluguel</button>
                    <p class="text-center mt-3 small">
                        <a href="index.html" class="text-muted">Cancelar e voltar</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/reserva.js"></script>
</body>

</html>
