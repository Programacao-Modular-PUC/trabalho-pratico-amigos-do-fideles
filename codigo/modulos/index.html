<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos do Fideles - Explorar Maraú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/index.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-fideles">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../img/logo.png" alt="Amigos do Fideles Logo">
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white me-3 d-none d-md-block" id="nomeUsuario">Olá, Amigo!</span>
                <a href="historico.html" class="btn btn-outline-light btn-sm me-2">Minhas Reservas</a>
                <a href="login.html" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <header class="py-5 text-center container">
        <div class="row py-lg-4">
            <div class="col-lg-8 mx-auto">
                <h1 class="fw-bold" style="color: var(--primary-marrom); font-family: 'Georgia', serif;">Onde você quer
                    relaxar?</h1>
                <p class="lead text-muted">Explore nossas residências exclusivas na Península de Maraú.</p>
                <div class="search-container">
                    <div class="input-group">
                    <input type="text" class="form-control search-input"
                            placeholder="Buscar por bairro em Maraú...">
                        <button class="btn btn-search" type="button">Buscar</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row g-4">
            <p class="text-center text-muted">Carregando residências...</p>
        </div>
    </main>

    <footer class="py-4 text-center text-muted border-top">
        <small>© 2026 Amigos do Fideles - Engenharia de Software PUC Minas</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
